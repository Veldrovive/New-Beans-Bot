# For developers creating new schema revisions:
#   uv run alembic revision --autogenerate -m "describe the change"
# The bot applies migrations itself on startup (beans_bot.db.migrations.upgrade_database).
[alembic]
script_location = src/beans_bot/db/migrations
sqlalchemy.url = sqlite:///data/dev_autogenerate.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
